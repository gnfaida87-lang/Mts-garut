<!DOCTYPE html>
<html lang="id">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="MTs PERSIS GARUT - Absensi, Jadwal, Nilai, dan Lainnya">
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#6F4E37">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MTs Persis">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- SEO Meta Tags -->
  <meta name="application-name" content="MTs Persis">
  <meta name="msapplication-TileColor" content="#6F4E37">
  <meta name="msapplication-TileImage" content="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MTs PERSIS GARUT</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    /* Loading indicator styles */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #9C6644;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .loading-spinner {
      text-align: center;
    }
    .loading-spinner::after {
      content: '';
      display: block;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* PWA Install banner styles */
    .install-banner {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      background: #FFFFFF;
      color: #6F4E37;
      padding: 14px 16px;
      border-radius: 12px;
      display: none;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      z-index: 9999;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translate(-50%, 100%); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .install-banner.visible {
      display: flex;
    }
    .install-banner-icon {
      font-size: 28px;
      flex-shrink: 0;
    }
    .install-banner-text {
      flex: 1;
      font-size: 13px;
      line-height: 1.4;
    }
    .install-banner-text strong {
      display: block;
      font-size: 14px;
    }
    .install-banner-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .install-banner button {
      background: #6F4E37;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      font-size: 13px;
    }
    .install-banner button:hover {
      background: #9C6644;
    }
    .install-banner-close {
      background: transparent !important;
      color: #666 !important;
      padding: 6px 8px !important;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loading-spinner">
      <div>Memuat aplikasi...</div>
    </div>
  </div>
  
  <script>
    // Hide loading when Flutter is ready
    var appReady = false;
    window.addEventListener('flutter-first-frame', function() {
      appReady = true;
      document.getElementById('loading')?.remove();
      if (deferredPrompt) showInstallBanner();
    });

    // Fallback: jika Flutter gagal load dalam 8 detik, sembunyikan loading
    // dan tampilkan pesan error yang lebih jelas
    setTimeout(function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.innerHTML = '<div class="loading-spinner" style="text-align:center;">'
          + '<div style="font-size:48px;margin-bottom:16px;">⚠️</div>'
          + '<div style="font-size:16px;font-weight:600;margin-bottom:8px;">Gagal memuat aplikasi</div>'
          + '<div style="font-size:13px;opacity:0.7;margin-bottom:16px;">Periksa koneksi internet dan coba lagi</div>'
          + '<button onclick="window.location.reload()" style="background:white;color:#9C6644;border:none;padding:10px 24px;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px;">Muat Ulang</button>'
          + '</div>';
      }
    }, 8000);

    // PWA Install: tangkap beforeinstallprompt lalu tampilkan banner install
    var deferredPrompt = null;
    var installBanner = null;

    // Deteksi apakah aplikasi sudah berjalan sebagai PWA (standalone)
    function isStandalonePWA() {
      return window.matchMedia('(display-mode: standalone)').matches
          || window.matchMedia('(display-mode: fullscreen)').matches
          || window.matchMedia('(display-mode: minimal-ui)').matches
          || window.navigator.standalone === true;
    }

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      if (appReady && !isStandalonePWA()) showInstallBanner();
    });

    window.addEventListener('appinstalled', function() {
      deferredPrompt = null;
      hideInstallBanner();
    });

    function showInstallBanner() {
      if (isStandalonePWA()) return; // Sudah terinstal sebagai PWA, tidak perlu saran instal
      if (installBanner) return;
      installBanner = document.createElement('div');
      installBanner.className = 'install-banner visible';
      installBanner.innerHTML =
        '<span class="install-banner-icon">📲</span>' +
        '<div class="install-banner-text"><strong>Instal Aplikasi MTs Persis</strong>Akses lebih cepat dari layar utama</div>' +
        '<div class="install-banner-actions">' +
        '<button onclick="installApp()">Instal</button>' +
        '<button class="install-banner-close" onclick="dismissInstallBanner()" title="Tutup">✕</button>' +
        '</div>';
      document.body.appendChild(installBanner);
    }

    function hideInstallBanner() {
      if (installBanner) {
        installBanner.remove();
        installBanner = null;
      }
    }

    function dismissInstallBanner() {
      deferredPrompt = null;
      hideInstallBanner();
    }

    function installApp() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(choiceResult) {
        deferredPrompt = null;
        hideInstallBanner();
      });
    }

    // Handle offline/online status
    window.addEventListener('online', function() {
      document.title = 'MTs PERSIS GARUT';
    });
    
    window.addEventListener('offline', function() {
      document.title = '[Offline] MTs Persis';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Register Service Worker for PWA - Fixed to prevent update loops
    (function() {
      if (!('serviceWorker' in navigator)) return;

      var swRegistered = false;

      function registerSW() {
        if (swRegistered) return;
        swRegistered = true;

        navigator.serviceWorker.register('/flutter_service_worker.js')
          .then(function(registration) {
            console.log('Service Worker registered:', registration.scope);

            // Check for updates periodically (every 30 min)
            setInterval(function() {
              registration.update().catch(function() {});
            }, 30 * 60 * 1000);

            // Versi baru diterapkan senyap: tidak ada banner "Refresh".
            // Update akan aktif pada reload/kunjungan berikutnya secara otomatis.
            registration.addEventListener('updatefound', function() {
              console.log('Service Worker: versi baru tersedia (senyap)');
            });
          })
          .catch(function(error) {
            console.log('SW registration failed:', error);
            swRegistered = false;
          });
      }

      // Register when page loads
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', registerSW);
      } else {
        registerSW();
      }
    })();
  </script>
</body>
</html>
