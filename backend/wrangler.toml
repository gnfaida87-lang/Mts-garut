name = "mts-garut"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database (Production)
[[d1_databases]]
binding = "DB"
database_name = "ppi-db-prod"
database_id = "f4f8e08d-1d77-4cd4-8021-225e88ae233c"

# Variables (production)
# ⚠️ JWT_SECRET dan JWT_REFRESH_SECRET di-set via Cloudflare Secrets, bukan di sini!
# Set dengan perintah:
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put JWT_REFRESH_SECRET
#
# Untuk development lokal, wrangler akan membaca dari .env file:
#   echo "JWT_SECRET=ppi-madrasah-dev-secret-key-2026" >> .env
#   echo "JWT_REFRESH_SECRET=ppi-madrasah-refresh-secret-key-2026" >> .env
[vars]
JWT_EXPIRES_IN = "8h"
CORS_ORIGIN = "https://mts-garut.pages.dev,https://ppi-bo8.pages.dev,https://f1198d05.ppi-bo8.pages.dev"

# Dev environment
[env.dev]
vars = { JWT_EXPIRES_IN = "8h", CORS_ORIGIN = "*" }

# Staging environment (untuk testing pre-production)
# Setup awal:
#   npx wrangler d1 create ppi-db-staging
#   npx wrangler d1 migrations apply ppi-db-staging
#   npx wrangler d1 execute ppi-db-staging --remote --file=src/db/seed.sql
[env.staging]
vars = { JWT_EXPIRES_IN = "8h", CORS_ORIGIN = "*" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ppi-db-staging"
database_id = ""  # ← ISI: jalankan 'npx wrangler d1 create ppi-db-staging', copy ID nya ke sini

# D1 migrations
[[migrations]]
tag = "v1"

[[migrations]]
tag = "v2"

[[migrations]]
tag = "v3"

[[migrations]]
tag = "v4"

[[migrations]]
tag = "v5"
