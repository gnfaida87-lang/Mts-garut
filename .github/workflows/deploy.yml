name: Deploy MTs Garut

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_seed:
        description: 'Jalankan seed data (HANYA untuk inisialisasi pertama)'
        type: boolean
        default: false

env:
  NODE_VERSION: '22'
  FLUTTER_VERSION: '3.32'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  test:
    name: Test All
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Backend Tests ──
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Backend - Install
        run: npm install
        working-directory: backend

      - name: Backend - Typecheck
        run: npm run typecheck
        working-directory: backend

      - name: Backend - Unit Tests
        run: npm test
        working-directory: backend

      # ── Frontend Tests ──
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Frontend - Install
        run: flutter pub get
        working-directory: frontend

      - name: Frontend - Analyze
        run: flutter analyze
        working-directory: frontend

      - name: Frontend - Unit Tests
        run: flutter test
        working-directory: frontend

  seed-database:
    name: Seed Database (Manual Only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_seed }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wrangler
        run: npm install

      - name: Apply Migrations (sebelum seed)
        run: npx wrangler d1 migrations apply mts-garut-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Seed Database
        run: npx wrangler d1 execute mts-garut-db --remote --file=src/db/seed.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-backend:
    name: Deploy Backend (Cloudflare Workers)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wrangler
        run: npm install

      - name: Apply D1 Migrations
        run: npx wrangler d1 migrations apply mts-garut-db --remote
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  deploy-frontend:
    name: Deploy Frontend (Cloudflare Pages)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Test sudah dijalankan di job 'test', tidak perlu diulang
      # ⚠️ JANGAN set repo variable API_BASE_URL ke localhost — hardcode agar aman dari salah konfigurasi
      - name: Build Flutter Web
        run: flutter build web --release --no-web-resources-cdn --dart-define=API_BASE_URL=https://mts-garut.gn-faida87.workers.dev

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy build/web --project-name=mts-garut --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
